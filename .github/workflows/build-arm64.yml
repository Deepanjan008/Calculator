name: Android ARM64 Native Build Pipeline

on:
  workflow_dispatch:

jobs:
  build-arm64:
    runs-on: ubuntu-24.04-arm

    steps:
      - name: 1. Checkout Repository
        uses: actions/checkout@v4

      - name: 2. Setup Java 21 Environment
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: 3. Install System Native ARM64 AAPT2 & Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y aapt android-framework-res

      - name: 4. Download Android Command-Line Tools
        run: |
          mkdir -p $HOME/android-sdk/cmdline-tools
          cd $HOME/android-sdk/cmdline-tools
          wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -O cmdline-tools.zip
          unzip -q cmdline-tools.zip
          mv cmdline-tools latest
          rm cmdline-tools.zip

      - name: 5. Export Android SDK Environment Variables
        run: |
          echo "ANDROID_HOME=$HOME/android-sdk" >> $GITHUB_ENV
          echo "$HOME/android-sdk/cmdline-tools/latest/bin" >> $GITHUB_PATH
          echo "$HOME/android-sdk/platform-tools" >> $GITHUB_PATH

      - name: 6. Update SDK Manager & Accept Licenses
        run: |
          yes | sdkmanager --sdk_root=$ANDROID_HOME --licenses
          sdkmanager --sdk_root=$ANDROID_HOME --update

      - name: 7. Install Android SDK 36 Components
        run: |
          sdkmanager --sdk_root=$ANDROID_HOME "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: 8. Execute Gradle Debug Build (AAPT2 CLI Override)
        run: |
          # Find genuine Ubuntu ARM64 compiled binary path (aapt2 or aapt)
          SYSTEM_AAPT2_PATH=$(which aapt2 || which aapt || find /usr -name "aapt*" -type f -executable 2>/dev/null | head -n 1)
          if [ -z "$SYSTEM_AAPT2_PATH" ]; then
            echo "ERROR: No aapt/aapt2 found in system!"
            exit 1
          fi
          echo "Using true native ARM64 AAPT at: $SYSTEM_AAPT2_PATH"
          chmod +x gradlew
          ./gradlew assembleDebug -Pandroid.aapt2FromMavenOverride="$SYSTEM_AAPT2_PATH"

      - name: 9. Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-arm64-debug
          path: app/build/outputs/apk/debug/*.apk
