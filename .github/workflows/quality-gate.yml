name: Quality gate

# Runs on every pull request and on main. Two steps run before anything is
# compiled, on purpose: they check that the quality gate itself is still in
# place. A build that passes because someone quietly deleted
# `allWarningsAsErrors` looks identical to a build that passes honestly, and this
# is the only place the difference can be caught.

on:
  workflow_dispatch:
  pull_request:
    branches: [ main ]
    paths-ignore: [ '**.md', 'docs/**' ]
  push:
    branches: [ main ]
    paths-ignore: [ '**.md', 'docs/**' ]

permissions:
  contents: read

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality-gate:
    name: Tests, lint and debug build
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v6

      - name: Make the wrapper executable
        run: chmod +x gradlew

      - name: The warning settings are still warnings-as-errors
        run: |
          set -e
          grep -q 'allWarningsAsErrors.set(true)' \
            build-logic/convention/src/main/kotlin/KotlinAndroid.kt \
            || { echo "::error::Kotlin warnings are no longer errors for Android modules."; exit 1; }
          grep -q 'allWarningsAsErrors.set(true)' \
            build-logic/convention/src/main/kotlin/KotlinJvmConventionPlugin.kt \
            || { echo "::error::Kotlin warnings are no longer errors for pure Kotlin modules."; exit 1; }
          grep -q -- '-Werror' build-logic/convention/src/main/kotlin/KotlinAndroid.kt \
            || { echo "::error::javac warnings are no longer errors."; exit 1; }
          grep -q 'warningsAsErrors = true' \
            build-logic/convention/src/main/kotlin/AndroidLibraryConventionPlugin.kt \
            || { echo "::error::lint warnings are no longer errors for libraries."; exit 1; }
          grep -q 'warningsAsErrors = true' \
            build-logic/convention/src/main/kotlin/AndroidApplicationConventionPlugin.kt \
            || { echo "::error::lint warnings are no longer errors for the app."; exit 1; }
          echo "Compiler, javac and lint all still treat a warning as a failure."

      - name: Nothing in the tree suppresses a warning
        run: |
          hits=$(grep -Rn --include='*.kt' -E '@Suppress\(|@SuppressLint|//noinspection' \
                   app core feature 2>/dev/null || true)
          if [ -n "$hits" ]; then
            echo "$hits"
            echo "::error::A warning was suppressed. Fix the cause or delete the code - see CONTRIBUTING.md."
            exit 1
          fi
          echo "No suppressions found."

      - name: Unit tests
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Android lint
        run: ./gradlew lint --stacktrace

      - name: Assemble the debug APK
        run: ./gradlew assembleDebug --stacktrace
